<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#475569;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    <pattern id="darkGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#darkGradient)"/>
  <rect width="1920" height="1080" fill="url(#darkGrid)"/>
  
  <!-- Glowing orbs -->
  <circle cx="400" cy="250" r="150" fill="url(#glow1)"/>
  <circle cx="1500" cy="400" r="200" fill="url(#glow2)"/>
  <circle cx="300" cy="750" r="120" fill="url(#glow1)"/>
  <circle cx="1600" cy="800" r="180" fill="url(#glow2)"/>
  
  <!-- Geometric shapes with subtle glow -->
  <circle cx="350" cy="300" r="60" fill="#3b82f6" opacity="0.15"/>
  <circle cx="1550" cy="350" r="80" fill="#8b5cf6" opacity="0.12"/>
  <circle cx="250" cy="700" r="40" fill="#06b6d4" opacity="0.18"/>
  <circle cx="1650" cy="750" r="70" fill="#10b981" opacity="0.14"/>
  
  <!-- Abstract polygons -->
  <polygon points="900,150 1000,250 900,350 800,250" fill="#f59e0b" opacity="0.08"/>
  <polygon points="1100,550 1250,650 1100,750 950,650" fill="#ef4444" opacity="0.09"/>
  
  <!-- Subtle connecting lines -->
  <line x1="0" y1="300" x2="1920" y2="350" stroke="#475569" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="600" x2="1920" y2="550" stroke="#475569" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="900" x2="1920" y2="850" stroke="#475569" stroke-width="1" opacity="0.4"/>
  
  <!-- Starfield effect -->
  <circle cx="150" cy="100" r="1" fill="#cbd5e1" opacity="0.6"/>
  <circle cx="500" cy="80" r="1" fill="#cbd5e1" opacity="0.8"/>
  <circle cx="800" cy="120" r="1" fill="#cbd5e1" opacity="0.7"/>
  <circle cx="1200" cy="90" r="1" fill="#cbd5e1" opacity="0.9"/>
  <circle cx="1500" cy="110" r="1" fill="#cbd5e1" opacity="0.6"/>
  <circle cx="1800" cy="130" r="1" fill="#cbd5e1" opacity="0.8"/>
</svg>