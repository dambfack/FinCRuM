<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCRuM - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            font-size: 1rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #fff, #e0e7ff);
            border-radius: 2px;
            width: 0%;
            animation: progress 3s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .dots {
            display: inline-block;
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .version {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }

        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">FinCRuM</div>
        <div class="subtitle">Financial Credit Risk Management</div>
        
        <div class="spinner"></div>
        
        <div class="status" id="status">Starting server<span class="dots"></span></div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="error-message" id="error-message">
            <div>Failed to connect to server. Please ensure the backend is running.</div>
            <button class="retry-button" onclick="retryConnection()">Retry Connection</button>
        </div>
    </div>
    
    <div class="version">v0.3.0</div>

    <script>
        let retryCount = 0;
        const maxRetries = 30;
        const retryInterval = 2000; // 2 seconds
        
        const statusMessages = [
            'Starting server',
            'Initializing application',
            'Loading components',
            'Connecting to backend',
            'Almost ready'
        ];
        
        let messageIndex = 0;
        
        function updateStatus() {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = statusMessages[messageIndex] + '<span class="dots"></span>';
            messageIndex = (messageIndex + 1) % statusMessages.length;
        }
        
        function checkServer() {
            fetch('http://localhost:9002')
                .then(response => {
                    if (response.ok) {
                        document.getElementById('status').textContent = 'Server ready! Loading application...';
                        setTimeout(() => {
                            window.location.href = 'http://localhost:9002';
                        }, 1000);
                    } else {
                        throw new Error('Server not ready');
                    }
                })
                .catch(error => {
                    retryCount++;
                    if (retryCount >= maxRetries) {
                        showError();
                    } else {
                        setTimeout(checkServer, retryInterval);
                    }
                });
        }
        
        function showError() {
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('status').textContent = 'Connection failed';
        }
        
        function retryConnection() {
            retryCount = 0;
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('status').innerHTML = 'Retrying connection<span class="dots"></span>';
            checkServer();
        }
        
        // Start checking server immediately
        checkServer();
        
        // Update status message every 2 seconds
        setInterval(updateStatus, 2000);
    </script>
</body>
</html>
