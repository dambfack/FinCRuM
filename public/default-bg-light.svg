<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#lightGradient)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Decorative geometric shapes -->
  <circle cx="300" cy="200" r="80" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1600" cy="300" r="120" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="200" cy="800" r="60" fill="#06b6d4" opacity="0.12"/>
  <circle cx="1700" cy="900" r="100" fill="#10b981" opacity="0.09"/>
  
  <!-- Abstract shapes -->
  <polygon points="800,100 900,200 800,300 700,200" fill="#f59e0b" opacity="0.06"/>
  <polygon points="1200,600 1350,700 1200,800 1050,700" fill="#ef4444" opacity="0.07"/>
  
  <!-- Subtle lines -->
  <line x1="0" y1="400" x2="1920" y2="450" stroke="#cbd5e1" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="700" x2="1920" y2="650" stroke="#cbd5e1" stroke-width="1" opacity="0.3"/>
</svg>